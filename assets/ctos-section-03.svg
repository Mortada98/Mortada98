    </pattern>
    
    <pattern id="grid2-arch" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#141410" stroke-width="0.4"/>
    </pattern>
  </defs>
  <rect width="900" height="64" fill="#060606"/>

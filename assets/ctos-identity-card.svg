<svg width="860" height="170" viewBox="0 0 860 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <pattern id="sl3" x="0" y="0" width="1" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="rgba(0,0,0,0.22)"/>
    </pattern>
    <!-- avatar grid -->
    <pattern id="avgrid" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="860" height="170" fill="#080808"/>
  <rect width="860" height="170" fill="url(#sl3)"/>
  <rect x="0.5" y="0.5" width="859" height="169" stroke="#383830" stroke-width="1" fill="none"/>
  <polyline points="0,16 0,0 16,0" stroke="white" stroke-width="1.2" fill="none"/>
  <polyline points="860,16 860,0 844,0" stroke="white" stroke-width="1.2" fill="none"/>
  <polyline points="0,154 0,170 16,170" stroke="white" stroke-width="1.2" fill="none"/>
  <polyline points="860,154 860,170 844,170" stroke="white" stroke-width="1.2" fill="none"/>

  <!-- HEADER bar -->
  <rect x="1" y="1" width="858" height="28" fill="#101010"/>
  <text x="18" y="19" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="3" fill="#505048">IDENTITY_VERIFIED</text>
  <text x="842" y="19" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#6db86d" text-anchor="end">● SESSION_ACTIVE</text>
  <line x1="1" y1="29" x2="859" y2="29" stroke="#383830" stroke-width="1"/>

  <!-- DATA fields -->
  <!-- EMPID -->
  <text x="18" y="55" font-family="'Courier New', Courier, monospace" font-size="7.5" letter-spacing="3" fill="#505048">EMPL_ID</text>
  <text x="18" y="72" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="2" fill="#e8e8e0">SAL-001-MA</text>
  <line x1="18" y1="78" x2="170" y2="78" stroke="#2e2e28" stroke-width="0.5"/>

  <!-- CLASS -->
  <text x="190" y="55" font-family="'Courier New', Courier, monospace" font-size="7.5" letter-spacing="3" fill="#505048">CLASS</text>
  <text x="190" y="72" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="2" fill="#e8e8e0">L5_PROV</text>
  <line x1="190" y1="78" x2="340" y2="78" stroke="#2e2e28" stroke-width="0.5"/>

  <!-- FULL NAME -->
  <text x="18" y="100" font-family="'Courier New', Courier, monospace" font-size="7.5" letter-spacing="3" fill="#505048">FULL_NAME / ALIAS</text>
  <text x="18" y="120" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" letter-spacing="4" fill="white">MORTADA</text>
  <line x1="18" y1="128" x2="380" y2="128" stroke="#2e2e28" stroke-width="0.5"/>

  <!-- LOCATION -->
  <text x="190" y="100" font-family="'Courier New', Courier, monospace" font-size="7.5" letter-spacing="3" fill="#505048">LOCATION_NODE</text>
  <text x="190" y="120" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="1.5" fill="#a0a09a">Salé, Rabat-Salé-Kénitra, MA</text>

  <!-- FINGERPRINT row -->
  <rect x="18" y="138" width="662" height="22" fill="rgba(255,255,255,0.04)" stroke="#333" stroke-width="0.5"/>
  <text x="30" y="153" font-family="'Courier New', Courier, monospace" font-size="9" letter-spacing="2" fill="#888880">♦  7D2412F9818XFA1  ·  fingerprint_hash_verified</text>

  <!-- AVATAR box -->
  <rect x="712" y="38" width="130" height="122" stroke="#383830" stroke-width="1" fill="#0d0d0d"/>
  <rect x="712" y="38" width="130" height="122" fill="url(#avgrid)"/>
  <!-- avatar user silhouette (simple SVG paths) -->
  <!-- head circle -->
  <circle cx="777" cy="82" r="22" stroke="#555550" stroke-width="1.5" fill="none"/>
  <circle cx="777" cy="82" r="10" fill="#383830"/>
  <!-- shoulders arc -->
  <path d="M 720 158 Q 777 118 834 158" stroke="#555550" stroke-width="1.5" fill="none"/>
  <!-- cross-hairs -->
  <line x1="777" y1="42" x2="777" y2="50" stroke="#333" stroke-width="0.8"/>
  <line x1="777" y1="114" x2="777" y2="122" stroke="#333" stroke-width="0.8"/>
  <line x1="716" y1="82" x2="724" y2="82" stroke="#333" stroke-width="0.8"/>
  <line x1="830" y1="82" x2="838" y2="82" stroke="#333" stroke-width="0.8"/>
</svg>